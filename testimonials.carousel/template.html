<section id="{{@id}}" class="cms-section">
  <div class="container">
    {{#heading}}<{{@h}} class="h1 fw-bold text-center mb-5">{{heading}}</{{@h}}>{{/heading}}
    <div id="{{@id}}-carousel" class="carousel slide col-lg-8 mx-auto px-5" role="region" aria-roledescription="carousel" aria-label="{{#heading}}{{heading}}{{/heading}}{{^heading}}{{@label}}{{/heading}}">
      <div class="carousel-inner">
        {{#items}}<figure class="carousel-item text-center mb-0{{#@first}} active{{/@first}}" role="group" aria-roledescription="slide" aria-label="{{@number}}">
          <blockquote class="fs-4 mb-4"><p class="mb-0">“{{quote}}”</p></blockquote>
          <figcaption class="d-flex justify-content-center"><div class="d-flex align-items-center gap-3">{{#photo}}{{photo sizes="48px" max="48" img="rounded-circle cms-thumb" decorative="true"}}{{/photo}}<div class="text-start"><p class="fw-bold mb-0">{{name}}</p>{{#role}}<p class="small text-body-secondary mb-0">{{role}}</p>{{/role}}</div></div></figcaption>
        </figure>{{/items}}
      </div>
      {{#items}}{{#@first}}{{^@last}}<button class="carousel-control-prev cms-quote-control" type="button" data-bs-target="#{{@id}}-carousel" data-bs-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">{{@t.prevSlide}}</span></button>
      <button class="carousel-control-next cms-quote-control" type="button" data-bs-target="#{{@id}}-carousel" data-bs-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">{{@t.nextSlide}}</span></button>{{/@last}}{{/@first}}{{/items}}
    </div>
  </div>
</section>
