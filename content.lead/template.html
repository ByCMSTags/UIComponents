<section id="{{@id}}" class="cms-clead">
  <div class="cms-clead__wrap">
    {{#title}}<{{@h}} class="cms-clead__title">{{title}}</{{@h}}>{{/title}}
    <div class="cms-clead__rule" aria-hidden="true"></div>
    <div class="cms-clead__copy">
      {{#description}}<p class="cms-clead__lead">{{description}}</p>{{/description}}
      {{#body}}<div class="cms-clead__body">{{body}}</div>{{/body}}
    </div>
  </div>
</section>
