<section id="{{@id}}" class="cms-section cms-acc cms-acc--signin">
  <div class="container">
    <div class="cms-acc__wrap mx-auto">
      {{#title}}<{{@h}} class="cms-acc__title text-center">{{title}}</{{@h}}>{{/title}}
      {{#text}}<p class="cms-acc__lead text-center">{{text}}</p>{{/text}}
      <div data-cms-account-signin data-redirect="{{redirect}}" data-account="{{redirect}}"></div>
    </div>
  </div>
</section>
