<footer class="border-top py-4">
  <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between gap-3 text-body-secondary">
    <div class="text-center text-md-start">
      <p class="small mb-1">© {{@site.name}} {{@year}}. {{@t.rights}}</p>
      <p class="small mb-0">{{@t.createdBy}} <a class="link-secondary" href="https://gipixel.com" rel="noopener" target="_blank">Gipixel</a></p>
    </div>
    {{#@social}}{{#@first}}<ul class="cms-social list-unstyled d-flex gap-2 mb-0">{{/@first}}{{/@social}}{{#@social}}<li><a class="link-secondary border" href="{{href}}" rel="noopener" target="_blank" aria-label="{{name}}">{{icon}}</a></li>{{/@social}}{{#@social}}{{#@last}}</ul>{{/@last}}{{/@social}}
  </div>
</footer>
