<section id="{{@id}}" class="py-5">
  <div class="container">
    <div class="bg-primary text-white rounded-4 p-4 p-md-5 d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-4">
      <div>
        {{#title}}<{{@h}} class="fw-bold mb-2">{{title}}</{{@h}}>{{/title}}
        {{#description}}<p class="mb-0 fs-5">{{description}}</p>{{/description}}
      </div>
      {{#buttonText}}{{#buttonLink}}<a class="btn btn-light btn-lg flex-shrink-0" href="{{buttonLink}}">{{buttonText}}</a>{{/buttonLink}}{{/buttonText}}
    </div>
  </div>
</section>
