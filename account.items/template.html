<section id="{{@id}}" class="cms-section cms-acc cms-acc--items">
  <div class="container">
    <div class="cms-acc__wrap cms-acc__wrap--list mx-auto">
      {{#title}}<{{@h}} class="cms-acc__title">{{title}}</{{@h}}>{{/title}}
      {{#text}}<p class="cms-acc__lead">{{text}}</p>{{/text}}
      <div data-cms-account-items data-collection="{{collection}}" data-signin="{{signinPage}}"></div>
    </div>
  </div>
</section>
