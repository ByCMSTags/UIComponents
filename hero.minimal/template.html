<section id="{{@id}}" class="cms-section bg-dark text-white">
  <div class="container py-lg-5">
    <div class="col-lg-9">
      {{#eyebrow}}<p class="text-uppercase fw-bold small mb-3 text-white-85">{{eyebrow}}</p>{{/eyebrow}}
      {{#title}}<{{@h}} class="display-3 fw-bold mb-4">{{title}}</{{@h}}>{{/title}}
      {{#description}}<p class="lead mb-4 text-white-85">{{description}}</p>{{/description}}
      {{#buttonText}}{{#buttonLink}}<a class="btn btn-primary btn-lg" href="{{buttonLink}}">{{buttonText}}</a>{{/buttonLink}}{{/buttonText}}
    </div>
  </div>
</section>
