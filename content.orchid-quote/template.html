<section id="{{@id}}" class="cms-or-quote">
  <div class="or-inner cms-or-quote__inner">
    <div class="cms-or-quote__head">
      {{#icon}}<span class="cms-or-quote__icon" aria-hidden="true">{{icon}}</span>{{/icon}}
      {{#title}}<{{@h}} class="or-title">{{title}}</{{@h}}>{{/title}}
    </div>
    {{#text}}<blockquote class="cms-or-quote__box"><p class="cms-or-quote__text">{{text}}</p></blockquote>{{/text}}
  </div>
</section>
