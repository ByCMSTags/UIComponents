<section id="{{@id}}" class="position-relative overflow-hidden bg-dark text-white text-center d-flex align-items-center min-vh-40">
  {{#image}}{{image sizes="100vw" class="position-absolute top-0 start-0 w-100 h-100 cms-cover" decorative="true"}}{{/image}}
  <div class="position-absolute top-0 start-0 w-100 h-100 cms-overlay"></div>
  <div class="container position-relative z-1 py-5">
    <div class="col-lg-8 mx-auto">
      {{#title}}<{{@h}} class="display-5 fw-bold mb-2">{{title}}</{{@h}}>{{/title}}
      {{#description}}<p class="lead mb-0 text-white-85">{{description}}</p>{{/description}}
    </div>
  </div>
</section>
